<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { Banner, Modal, Tooltip, Button, Spinner } = window.QCHDWishlistTrackerDesignSystem_1b3257;
function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:"flex", flexDirection:"column", gap:12}}>
      <Banner tone="error">Failed to reach the scraper service.</Banner>
      <Banner tone="success">Saved. 2 immediate matches found in current inventory.</Banner>
      <Banner tone="info"><Spinner /> Scrape in progress — this usually takes 2–5 minutes.</Banner>
      <Banner tone="subtle">External alerts enabled: email + SMS</Banner>
      <div style={{display:"flex", gap:12, alignItems:"center"}}>
        <Button variant="danger" onClick={() => setOpen(true)}>Delete…</Button>
        <Tooltip label="Refresh inventory"><Button variant="ghost">⟳</Button></Tooltip>
      </div>
      <Modal open={open} title="Delete this wishlist entry?"
        actions={<><Button variant="ghost" onClick={() => setOpen(false)}>Cancel</Button><Button variant="danger" onClick={() => setOpen(false)}>Delete</Button></>}
        onClose={() => setOpen(false)}>
        This can't be undone.
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
